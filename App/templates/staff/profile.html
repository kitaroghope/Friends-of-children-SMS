{% extends 'base.html' %}

{% block title %}My Profile - Friends of Children SMS{% endblock %}

{% block body %}
<style>
    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--carbon-spacing-05); }
    .profile-section { margin-bottom: var(--carbon-spacing-06); }
    .profile-section h3 { margin-bottom: var(--carbon-spacing-04); padding-bottom: var(--carbon-spacing-03); border-bottom: 1px solid var(--carbon-gray-20); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--carbon-spacing-04); }
    @media (max-width: 768px) { .profile-grid, .form-row { grid-template-columns: 1fr; } }
</style>

<header class="page-header">
    <div class="cds--grid">
        <h1>My Staff Profile</h1>
        <a href="/dashboard/">&larr; Back to Dashboard</a>
    </div>
</header>

<div class="main-content">
    <div class="cds--grid">
        <div class="cds--tile">
            <form method="post">
                {% csrf_token %}

                <div class="profile-section">
                    <h3>Personal Information</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="first_name">First Name *</label>
                            <input type="text" id="first_name" name="first_name" class="cds--text-input" value="{{ staff.first_name }}" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="last_name">Last Name *</label>
                            <input type="text" id="last_name" name="last_name" class="cds--text-input" value="{{ staff.last_name }}" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" name="email" class="cds--text-input" value="{{ staff.email|default:'' }}">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="phone">Phone *</label>
                            <input type="text" id="phone" name="phone" class="cds--text-input" value="{{ staff.phone|default:'' }}" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="gender">Gender</label>
                            <select id="gender" name="gender" class="cds--select">
                                <option value="">Select...</option>
                                <option value="male" {% if staff.gender == 'male' %}selected{% endif %}>Male</option>
                                <option value="female" {% if staff.gender == 'female' %}selected{% endif %}>Female</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="address">Address</label>
                            <textarea id="address" name="address" class="cds--text-input" rows="2">{{ staff.address|default:'' }}</textarea>
                        </div>
                    </div>
                </div>

                <div class="profile-section">
                    <h3>Employment Information</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="department">Department *</label>
                            <input type="text" id="department" name="department" class="cds--text-input" value="{{ staff.department|default:'' }}" required placeholder="e.g., Administration, Academic">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="position">Position *</label>
                            <input type="text" id="position" name="position" class="cds--text-input" value="{{ staff.position|default:'' }}" required placeholder="e.g., Head Teacher, Class Teacher">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="emergency_contact">Emergency Contact</label>
                        <input type="text" id="emergency_contact" name="emergency_contact" class="cds--text-input" value="{{ staff.emergency_contact|default:'' }}" placeholder="Name - Phone">
                    </div>
                </div>

                <div class="profile-section">
                    <h3>Additional Notes</h3>
                    <div class="form-group">
                        <textarea id="notes" name="notes" class="cds--text-input" rows="3" placeholder="Any additional information...">{{ staff.notes|default:'' }}</textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="/dashboard/" class="cds--btn cds--btn--secondary">Cancel</a>
                    <button type="submit" class="cds--btn cds--btn--primary">Save Profile</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
